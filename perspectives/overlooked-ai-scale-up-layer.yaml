description: "Väittää, että omistaja-johtajaomisteiset PK-yritykset — yritykset, joilla on olemassa olevat asiakkaat, tulot ja toiminnallinen tietämys — ovat rakenteellisesti hyvässä asemassa hyötymään agenttimaisesta tekoälystä, koska mahdollisuus on toimitusinnovaatio, ei tuoteinnovaatio, yhdistettynä 'globaalisti paikalliseen' laajentumiskuvioon. Alkuperäisartikkeli on englanninkielinen; tämä kuvaus on käännetty. Lähde alkutekstin PK-yritys/yrittäjä-linssille (Osio 38)."
